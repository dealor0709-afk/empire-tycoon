<style>

<style>
/* ===== v15 : finitions premium ===== */
:root{--gold:#f5c542;--ease:cubic-bezier(.2,.8,.2,1)}
body{font-size:15px;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#ffffff22;border-radius:8px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background:#ffffff44;border:2px solid transparent;background-clip:padding-box}
.gl{background:linear-gradient(180deg,#ffffff0e,#ffffff05);border:1px solid #ffffff16;box-shadow:inset 0 1px 0 #ffffff12,0 6px 24px #0004}
header{background:linear-gradient(180deg,#0e1020ee,#0a0b14ee);border-bottom:1px solid #ffffff12;box-shadow:0 10px 30px #0006}
header>div:first-child small:first-child{color:var(--gold)}
#bal{font-size:28px;letter-spacing:-.02em}
.inc{text-shadow:0 0 18px #2ee37a55}

.item{transition:transform .3s var(--ease),border-color .3s,box-shadow .3s}
.item:hover{transform:translateY(-2px);border-color:#f5c54255;box-shadow:0 12px 34px #000a,0 0 0 1px #f5c54222}
.item h4{font-size:15px;letter-spacing:-.01em}.item p{font-size:13px;line-height:1.5}
.btn{box-shadow:0 4px 14px #4f7cff44,inset 0 1px 0 #ffffff33;transition:transform .15s var(--ease),filter .2s,box-shadow .2s}
.btn:hover{box-shadow:0 6px 20px #4f7cff66,inset 0 1px 0 #ffffff44}

.ov{animation:ovin .22s ease-out}.ov .box,.ov .paper{animation:boxin .32s var(--ease)}
@keyframes ovin{from{opacity:0}}@keyframes boxin{from{opacity:0;transform:translateY(16px) scale(.97)}}
.box{background:linear-gradient(180deg,#191a26,#12131c);border:1px solid #ffffff1a;box-shadow:0 30px 80px #000c}
#toast{animation:tin .28s var(--ease);background:linear-gradient(180deg,#1c1d2cf2,#14151fee);border:1px solid #f5c54266;backdrop-filter:blur(12px);font-weight:600}
@keyframes tin{from{opacity:0;transform:translate(-50%,14px)}}

 send(room,m){const h=J("et_chat:"+room,[]);h.push(m);if(h.length>80)h.splice(0,h.length-80);SJ("et_chat:"+room,h);SJ("et_msg",{k:Math.random(),room,m})},
 onMsg(fn){addEventListener("storage",e=>{if(e.key=="et_msg"&&e.newValue){try{const o=JSON.parse(e.newValue);fn(o.room,o.m)}catch(x){}}})},
 saveCloud(id,state){},
 loadCloud(id){return null}
};
W.ET_encode=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o))));
W.ET_decode=c=>{try{const o=JSON.parse(decodeURIComponent(escape(atob(String(c).trim().replace(/\s+/g,"")))));const s=o&&o.s;return s&&typeof s=="object"&&typeof s.cash=="number"?o:null}catch(e){return null}};
const profs=()=>J("et_profiles",[]),setProfs=a=>SJ("et_profiles",a);
function ensureProfile(id,name,av){const a=profs();let p=a.find(x=>x.id==id);if(!p){p={id,name:name||("Joueur "+rid(4)),av:av==null?Math.random()*AV.length|0:av,created:Date.now()};a.push(p);setProfs(a);
 if(LS.getItem("tycoon2")&&!LS.getItem("et_legacy_done")&&!LS.getItem("tycoon2:"+id)){LS.setItem("tycoon2:"+id,LS.getItem("tycoon2"));LS.setItem("et_legacy_done","1");p.legacy=1;setProfs(a)}}
 return p}
function start(cur){
 sessionStorage.setItem("et_cur",JSON.stringify(cur));LS.setItem("et_last",cur.id);
 const _pa=profs(),_pp=_pa.find(x=>x.id==cur.id);if(_pp&&!_pp.pub){_pp.pub="P"+rid(8);setProfs(_pa)}
 W.ET={id:cur.id,pid:_pp?_pp.pub:"P"+rid(8),name:cur.name,av:cur.av,room:cur.room,mode:cur.mode,key:"tycoon2:"+cur.id};
 const l=document.getElementById("lobby");if(l)l.remove();
 const ld=document.getElementById("ld");if(ld)ld.style.display="flex";
 const s=document.createElement("script");s.textContent=document.getElementById("gamecode").textContent;document.body.appendChild(s)}
W.ET_switch=function(){sessionStorage.removeItem("et_cur");LS.setItem("et_force","1");location.reload()};
const cur0=(()=>{try{return JSON.parse(sessionStorage.getItem("et_cur"))}catch(e){return null}})();
if(cur0&&cur0.id){start(cur0);return}
/* URL : ?id=...&name=...&room=CODE (la plateforme peut lancer le jeu directement) */
const q=new URLSearchParams(location.search),qid=q.get("id");
if(qid&&okId(qid)){const p=ensureProfile(qid,(q.get("name")||"").slice(0,16));try{history.replaceState(null,"",location.pathname)}catch(e){}const rc=(q.get("room")||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
 start({id:p.id,name:p.name,av:p.av,mode:rc?"private":"public",room:rc?"p-"+rc:"public"});return}
const pref=J("et_pref",{mode:"public",code:rid(6)});
/* Écran de lancement : uniquement à la toute première connexion (ou si on demande « Changer de profil ») */
{const lp=LS.getItem("et_last"),p=profs().find(x=>x.id==lp);
 if(p&&!LS.getItem("et_force")){const pr=pref.mode=="private"&&pref.code;start({id:p.id,name:p.name,av:p.av,mode:pr?"private":"public",room:pr?"p-"+pref.code:"public"});return}}
const ld=document.getElementById("ld");if(ld)ld.style.display="none";
let sel=LS.getItem("et_last"),form=null,mode=pref.mode||"public",code=pref.code||rid(6),av=Math.random()*AV.length|0,err="";
if(!profs().some(p=>p.id==sel))sel=profs()[0]?profs()[0].id:null;
const root=document.createElement("div");root.id="lobby";document.body.appendChild(root);
const fm=n=>n>=1e12?(n/1e12).toFixed(2)+"T":n>=1e9?(n/1e9).toFixed(2)+"B":n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?(n/1e3).toFixed(1)+"k":Math.floor(n);
function draw(){
 const P=profs();
 root.innerHTML=`<div class="lb-box"><div class="lb-logo">🏢</div><h1>EMPIRE TYCOON</h1><p class="lb-sub">Choisis ton profil, puis ta partie</p>
 <div class="lb-sec"><h3><i>1</i>Profil</h3>
 <div class="lb-list">${P.length?P.map(p=>`<div class="lb-p ${p.id==sel?"on":""}" data-a="pick" data-id="${esc(p.id)}"><span class="lb-av">${AV[p.av%AV.length]}</span><div><b>${esc(p.name)}</b><small>${p.w?fm(p.w)+" $ · niv. "+(p.l||1):"nouveau"}</small></div></div>`).join(""):`<p class="lb-mut">Aucun profil sur cet appareil. Crée-en un pour commencer.</p>`}</div>
 <div class="lb-row"><button data-a="new">＋ Nouveau profil</button><button data-a="id">🔑 Entrer un ID</button></div>
 <div id="lbf">${form=="new"?`<div class="lb-form"><input id="fn" maxlength="16" placeholder="Ton pseudo (2–16 caractères)"><div class="lb-avs">${AV.map((a,i)=>`<span class="${i==av?"on":""}" data-a="av" data-i="${i}">${a}</span>`).join("")}</div><button class="lb-ok" data-a="mknew">Créer le profil</button></div>`:form=="id"?`<div class="lb-form"><input id="fi" type="password" autocomplete="off" maxlength="40" placeholder="Ton ID secret"><p class="lb-mut">🔒 Ton ID est personnel : ne le partage jamais.</p><textarea id="fc" rows="2" placeholder="Code de sauvegarde (optionnel) pour récupérer une progression"></textarea><button class="lb-ok" data-a="mkid">Valider</button></div>`:""}</div></div>
 <div class="lb-sec"><h3><i>2</i>Partie</h3><div class="lb-modes">
 <div class="lb-m ${mode=="public"?"on":""}" data-a="mode" data-m="public"><b>🌍 Publique</b><small>Classement et chat ouverts à tous les joueurs</small></div>
 <div class="lb-m ${mode=="private"?"on":""}" data-a="mode" data-m="private"><b>🔒 Privée</b><small>Classement et chat réservés à ceux qui ont ton code</small></div></div>
 ${mode=="private"?`<div class="lb-code"><input id="rc" maxlength="12" value="${esc(code)}" placeholder="Code de la partie"><button data-a="gen">🎲 Générer</button></div><p class="lb-mut">Partage ce code à tes amis : ils choisissent « Privée » et le saisissent.</p>`:""}</div>
 ${err?`<p class="lb-err">${esc(err)}</p>`:""}
 <button class="lb-go ${sel?"":"off"}" data-a="go">▶ Jouer</button>
 <p class="lb-foot">Ta progression est liée à un ID secret : ne le partage jamais, sinon quelqu'un pourrait accéder à ta session.</p></div>`}
root.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a;err="";
 if(a=="pick"){sel=t.dataset.id;form=null}
 else if(a=="new"){form=form=="new"?null:"new"}
 else if(a=="id"){form=form=="id"?null:"id"}
 else if(a=="av"){av=+t.dataset.i;const n=document.getElementById("fn").value;draw();document.getElementById("fn").value=n;return}
 else if(a=="mknew"){const n=document.getElementById("fn").value.trim();if(n.length<2){err="Pseudo trop court (2 caractères minimum)";draw();return}const p=ensureProfile(newId(),n,av);sel=p.id;form=null}
 else if(a=="mkid"){const id=document.getElementById("fi").value.trim(),c=document.getElementById("fc").value.trim();if(!okId(id)){err="ID invalide (3 à 40 caractères : lettres, chiffres, - _ . :)";draw();return}
  if(c){const o=ET_decode(c);if(!o){err="Code de sauvegarde invalide";draw();return}LS.setItem("tycoon2:"+id,JSON.stringify(o.s))}
  const p=ensureProfile(id,"");sel=p.id;form=null}
 else if(a=="mode"){mode=t.dataset.m}
 else if(a=="gen"){code=rid(6)}
 else if(a=="go"){if(!sel){err="Crée ou choisis un profil d'abord";draw();return}
  let room="public";if(mode=="private"){const c=(document.getElementById("rc").value||"").toUpperCase().replace(/[^A-Z0-9]/g,"");if(c.length<4){err="Le code de la partie privée doit faire au moins 4 caractères";draw();return}code=c;room="p-"+c}
  SJ("et_pref",{mode,code});LS.removeItem("et_force");const p=profs().find(x=>x.id==sel);start({id:p.id,name:p.name,av:p.av,mode,room});return}
 draw()});
draw();
})();

/* Missions : récompenses réduites (surtout en début de partie) */
MIS.forEach(m=>{if(m[5])return;m[5]=m[2];const r=m[2],v=r*Math.pow(Math.min(1,r/1e9),.25),d=Math.pow(10,Math.max(0,Math.floor(Math.log10(Math.max(v,1)))-1));m[2]=Math.max(5,Math.round(v/d)*d)});
</script>
